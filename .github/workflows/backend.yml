name: Deploy rules and functions
on:
  push:
    branches: [main]
    paths: ['firestore.rules', 'storage.rules', 'firebase.json', 'functions/**', 'tests/rules/**', 'scripts/deploy-rules.mjs', '.github/workflows/backend.yml']
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: backend
  cancel-in-progress: false
jobs:
  rules-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Firestore and Storage rules against the emulators
        working-directory: tests/rules
        run: |
          npm ci --no-audit --no-fund
          npm test
  deploy:
    needs: rules-test
    # Turned on with the repository variable BACKEND_DEPLOY=on once the deploy account has its permissions.
    if: vars.BACKEND_DEPLOY == 'on'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Keyless: GitHub's OIDC token is exchanged for the github-deploy service account (main branch of this repo only).
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/672657048901/locations/global/workloadIdentityPools/github/providers/github-repo
          service_account: github-deploy@kyushu-2e307.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Release rules
        run: node scripts/deploy-rules.mjs
      - name: Deploy functions (when functions/ changed, or run by hand)
        run: |
          if [ "${{ github.event_name }}" = push ] && ! git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" | grep -q '^functions/'; then
            echo "functions/ unchanged"; exit 0
          fi
          F=$PWD/functions
          COMMON="--project=kyushu-2e307 --gen2 --region=asia-northeast1 --runtime=nodejs22 --source=$F --memory=256Mi --max-instances=3 --quiet"
          FIRESTORE="--trigger-location=asia-northeast1 --trigger-event-filters=type=google.cloud.firestore.document.v1.written --trigger-event-filters=database=(default)"
          DS=DEEPSEEK_API_KEY=deepseek-api-key:latest PL=PLACES_API_KEY=places-api-key:latest RA=RAPIDAPI_KEY=rapidapi-key:latest
          # All functions deploy at the same time (each one's log is printed when it ends); the step fails if any failed.
          mkdir -p /tmp/deploy
          deploy() { (gcloud functions deploy "$1" $COMMON --entry-point="$1" "${@:2}" >"/tmp/deploy/$1.log" 2>&1 && echo ok >"/tmp/deploy/$1.ok") & }
          deploy processReceipt $FIRESTORE --trigger-event-filters-path-pattern=document='trips/{trip}/receiptJobs/{id}' --set-secrets=$DS --timeout=180s
          deploy translateNames $FIRESTORE --trigger-event-filters-path-pattern=document='trips/{trip}/{col}/{id}' --set-secrets=$DS --timeout=180s
          deploy findBuyPlaces --trigger-http --set-secrets=$DS,$PL --timeout=90s
          deploy aiRoutes --trigger-http --set-secrets=$DS --timeout=120s
          deploy planDay --trigger-http --set-secrets=$DS,$PL,$RA --timeout=120s
          deploy discoverPlaces --trigger-http --set-secrets=$DS,$PL --timeout=120s
          deploy lookupPlace --trigger-http --set-secrets=$PL,$DS --timeout=60s
          deploy suggestRoutes --trigger-http --set-secrets=$PL,$RA --timeout=40s
          deploy manageTrip --trigger-http --set-secrets=$PL --timeout=40s
          wait
          failed=0
          for log in /tmp/deploy/*.log; do
            f=$(basename "$log" .log)
            echo "::group::$f"; cat "$log"; echo "::endgroup::"
            [ -f "/tmp/deploy/$f.ok" ] || { echo "::error::$f failed to deploy"; failed=1; }
          done
          exit $failed
